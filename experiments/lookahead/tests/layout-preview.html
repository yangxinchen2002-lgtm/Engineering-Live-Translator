<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ELT 字幕排版验证</title>
<script src="/layout.js"></script><style>
body{background:#0d1625;color:#edf3ff;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;margin:24px}
section{box-sizing:border-box;max-width:100%;margin:16px 0;padding:12px 18px;background:#17283b;border:1px solid #49677a;border-radius:10px}
h1{font-size:22px}h2{font-size:13px;color:#99c7d9;margin:0 0 12px}pre{white-space:pre-wrap;font-size:12px}
</style></head><body><h1>整句字幕 · 实际排版检查</h1><p>仅用于宽度与字号测试，不是识别输出。</p><main id="cards"></main><pre id="result">正在测量</pre>
<script>
const css=document.createElement('style');css.textContent=ELTFollow.captionCSS;document.head.append(css);
const en='If the eigenvalues of the system matrix have negative real parts, the corresponding continuous-time linear system is asymptotically stable, provided that the stated assumptions hold.';
const zh='如果系统矩阵的所有特征值都具有负实部，那么在上述假设成立的条件下，对应的连续时间线性系统是渐近稳定的；这里必须保留特征值实部的符号和原句中的条件关系。';
const cards=[];
for(const [label,width,multiple] of [['宽窗口',960,1],['中等窗口',560,1],['小窗口',360,1],['极长文本保留全文',360,4]]){
  const section=document.createElement('section');section.style.width=width+'px';
  const title=document.createElement('h2');title.textContent=label+' · '+width+' px';
  const source=document.createElement('p'),target=document.createElement('p');source.className='elt-source';target.className='elt-translation';
  source.textContent=Array(multiple).fill(en).join(' ');target.textContent=zh.repeat(multiple);
  section.append(title,source,target);document.querySelector('#cards').append(section);cards.push({label,source,target});
}
function measure(){
  const cases=cards.map(c=>({label:c.label,width:c.source.clientWidth,
    source:ELTFollow.fitCaption(c.source,16,10),translation:ELTFollow.fitCaption(c.target,18,10),
    source_characters:c.source.textContent.length,translation_characters:c.target.textContent.length,
    no_horizontal_overflow:c.source.scrollWidth<=c.source.clientWidth+1&&c.target.scrollWidth<=c.target.clientWidth+1}));
  const result={cases,all_full_text_preserved:cards.every((c,i)=>c.source.textContent===(i===3?Array(4).fill(en).join(' '):en)&&c.target.textContent===(i===3?zh.repeat(4):zh)),
    all_sizes_bounded:cases.every(c=>[c.source,c.translation].every(x=>x.fontSize>=10&&x.fontSize<=18)),
    all_no_horizontal_overflow:cases.every(c=>c.no_horizontal_overflow)};
  document.querySelector('#result').textContent=JSON.stringify(result,null,2);window.layoutResult=result;
}
document.fonts.ready.then(measure);addEventListener('resize',measure);
</script></body></html>
