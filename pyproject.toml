[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-live-translator"
version = "0.1.1"
description = "Windows per-process audio capture, local ASR and bounded bilingual translation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
asr = ["faster-whisper==1.2.1", "ctranslate2==4.6.0", "onnxruntime==1.23.2", "av==16.0.1", "huggingface-hub==0.36.0", "tokenizers==0.22.1", "setuptools==80.9.0"]
evaluation = ["jiwer==4.0.0", "rapidfuzz==3.14.3"]
translation = ["httpx==0.28.1"]
ui = ["PySide6==6.8.3", "av==16.0.1", "pycaw==20260927; sys_platform == 'win32'", "comtypes==1.4.17; sys_platform == 'win32'", "psutil==7.2.2", "pywebview==6.1; sys_platform == 'win32'", "pythonnet==3.0.5; sys_platform == 'win32'"]

[project.scripts]
elt = "app.main:main"

[project.gui-scripts]
elt-gui = "app.ui.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["locales/*.json"]
"app.ui" = ["assets/*.svg", "assets/*.ico"]
"app.translation" = ["deepseek_pricing.json"]
"app.web_follow" = ["web/*", "web/vendor/*", "extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires built helper, VLC and live Windows audio"]

