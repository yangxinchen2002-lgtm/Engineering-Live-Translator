<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELT · 网页字幕</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="brand"><img src="icon48.png" width="36" height="36" alt="ELT"><div><h1>网页字幕</h1><p>跟随课程，轻松理解</p></div><span class="badge">ELT</span></header>
<div class="connection"><span id="dot" class="dot"></span><p id="status" role="status">检查连接…</p></div>
<section class="course" aria-label="课程操作"><label>原始语言<select id="language"><option value="auto">自动检测</option><option value="de">德语</option><option value="en">英语</option><option value="ja">日语</option><option value="zh">中文</option><option value="fr">法语</option><option value="ru">俄语</option><option value="it">意大利语</option><option value="ko">韩语</option></select></label><button id="start" class="primary">开始字幕</button><button id="stop" class="stop">停止字幕</button></section>
<fieldset id="captions" disabled><section class="card"><div class="section-title"><span>字幕外观</span><span class="subtle">短句自动收紧</span></div><div class="caption-grid"><label>宽度<div class="number"><input id="captionWidth" type="number" min="30" max="100" value="92"><span>%</span></div></label><label>高度上限<div class="number"><input id="captionHeight" type="number" min="64" max="600" value="180"><span>px</span></div></label><label>字号<div class="number"><input id="captionFont" type="number" min="8" max="48" value="18"><span>px</span></div></label></div></section></fieldset>
<fieldset id="reading" disabled>
<section class="card"><div class="section-title"><label class="switch"><input id="narrate" type="checkbox"><span>译文朗读</span></label><span class="subtle">朗读声音</span></div>
<div class="voice-grid"><label>模型<select id="model"><option value="qwen:0.6B">本地 0.6B · 快速</option><option value="qwen:1.7B">本地 1.7B · 讲课</option><option value="system">Windows 系统音色</option></select></label><label>音色<select id="voice" aria-label="朗读音色"></select></label></div></section>
<section class="card playback"><label>基础语速<div class="number"><input id="speed" type="number" min="1" max="2" step="0.05" value="1.00"><span>倍</span></div></label><label>朗读音量<div class="range"><input id="volume" type="range" min="0" max="100" value="80"><output id="volumeValue">80%</output></div></label></section>
<section class="card source"><label class="switch"><input id="duck" type="checkbox" checked><span>朗读时降低原声</span></label><div class="source-row"><label for="source">原声保留</label><div class="number"><input id="source" type="number" min="10" max="100" step="1" value="20"><span>%</span></div><span class="subtle">读完恢复</span></div></section>
</fieldset>
<p id="message" class="message" role="status">连接 ELT 后可调整朗读设置。</p>
<footer>播放、暂停和跳转由原网页控制。</footer>
<script src="ui-locale.js"></script><script src="popup.js"></script></body></html>
